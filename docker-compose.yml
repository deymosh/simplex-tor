services:
  simplex-tor:
    image: ghcr.io/deymosh/tor:latest
    container_name: simplex-tor
    restart: unless-stopped
    # Tor enforces DataDirectory ownership and runs unprivileged: the
    # ./simplex script exports the invoking user's UID/GID on Linux, and
    # 1000:1000 (toruser) on Docker Desktop, where it also chowns ./data/tor.
    user: "${TOR_UID}:${TOR_GID}"
    depends_on:
      - simplex-smp
      - simplex-xftp
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - ./data/tor:/data/.tor:z

  simplex-smp:
    image: simplexchat/smp-server:latest
    container_name: simplex-smp
    restart: unless-stopped
    user: "${USER_UID}:${USER_GID}"
    environment:
      - WEB_MANUAL=${WEB_MANUAL:-1}
      - ADDR=${ADDR_SMP?"Please specify the SMP domain."}
      - PASS=${PASS:-}
    volumes:
      - ./data/smp/config:/etc/opt/simplex:z
      - ./data/smp/state:/var/opt/simplex:z

  simplex-xftp:
    image: simplexchat/xftp-server:latest
    container_name: simplex-xftp
    restart: unless-stopped
    user: "${USER_UID}:${USER_GID}"
    environment:
      - ADDR=${ADDR_XFTP?"Please specify the XFTP domain."}
      - QUOTA=${QUOTA?"Please specify the quota for the XFTP server."}
      - PASS=${PASS:-}
    volumes:
      - ./data/xftp/config:/etc/opt/simplex-xftp:z
      - ./data/xftp/state:/var/opt/simplex-xftp:z
      - ./data/xftp/files:/srv/xftp

  # Chat relay: a simplex-chat client in relay mode. It has no inbound ports -
  # it reaches SMP servers (ours, over Tor) outbound via the simplex-tor SOCKS
  # proxy, sharing its network namespace.
  simplex-relay:
    build: ./relay
    image: simplex-chat-relay:local
    container_name: simplex-relay
    restart: unless-stopped
    user: "${USER_UID}:${USER_GID}"
    network_mode: "service:simplex-tor"
    depends_on:
      - simplex-tor
    environment:
      - RELAY_NAME=${RELAY_NAME?"Please specify the relay display name."}
      - RELAY_SMP_SERVER=${RELAY_SMP_SERVER:-}
    volumes:
      - ./data/relay:/data:z
